<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomiuAndNiiu</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf7f2; /* Màu pastel be/kem */
        }

        /* Hiệu ứng chuyển trang */
        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .view-section.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hiệu ứng blur cho text khi quay số ngẫu nhiên */
        .blur-text {
            filter: blur(2px);
            transform: scale(1.05);
            transition: all 0.1s ease;
        }

        /* Ẩn thanh cuộn nhưng vẫn cuộn được */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-4 md:p-8 flex justify-center items-center">

    <!-- Container chính -->
    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-sm border border-orange-50 overflow-hidden flex flex-col h-[90vh] relative">
        
        <!-- TRANG 1: HOME -->
        <div id="view-home" class="view-section active flex-col flex-1 items-center justify-center p-8">
            <!-- Hình ảnh chèn vào trên tiêu đề -->
            <img src="ava.JPG" alt="Tom và Nị" class="w-32 h-32 object-cover rounded-full shadow-md mb-6 border-4 border-orange-50">
            <h1 class="text-3xl font-semibold text-orange-900 text-center tracking-tight mb-2">Tom bá khí và Nị bé tý ăn gì và nghĩ gì?</h1>
            <p class="text-orange-600/70 text-center mb-10">Hôm nay có gì hot?</p>
            
            <div class="w-full space-y-4">
                <button onclick="switchView('view-advice')" class="w-full bg-rose-50 hover:bg-rose-100 border border-rose-100 text-rose-800 p-6 rounded-2xl flex items-center space-x-4 transition-all hover:scale-[1.02] shadow-sm">
                    <div class="bg-white p-3 rounded-full shadow-sm shrink-0 text-rose-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
                    </div>
                    <div class="text-left">
                        <h3 class="font-semibold text-lg">Tư vấn tình củm</h3>
                        <p class="text-sm opacity-70">Tại sao em giận? Tại sao anh khó chịu? Cách giải quyết mâu thuẫn...</p>
                    </div>
                </button>

                <button onclick="switchView('view-food')" class="w-full bg-blue-50 hover:bg-blue-100 border border-blue-100 text-blue-800 p-6 rounded-2xl flex items-center space-x-4 transition-all hover:scale-[1.02] shadow-sm">
                    <div class="bg-white p-3 rounded-full shadow-sm shrink-0 text-blue-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
                    </div>
                    <div class="text-left">
                        <h3 class="font-semibold text-lg">Đang thèm món gì?</h3>
                        <p class="text-sm opacity-70">Nếu khom có sự lựa chọn thì hãy để vòng xoay may mắn quyết định.</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- TRANG 2: CẢM NHẬN & LỜI KHUYÊN -->
        <div id="view-advice" class="view-section flex-col h-full">
            <header class="bg-rose-50/50 p-4 border-b border-rose-100 flex items-center shrink-0">
                <button onclick="switchView('view-home')" class="p-2 mr-4 bg-white rounded-full text-gray-500 hover:text-rose-600 shadow-sm transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                </button>
                <h2 class="text-xl font-semibold text-rose-900">Góc tư vấn</h2>
            </header>
            
            <main class="flex-1 overflow-y-auto p-6 scroll-smooth no-scrollbar flex flex-col space-y-8">
                <!-- Vùng nhập liệu -->
                <section class="space-y-3 relative">
                    <label class="block text-sm font-medium text-gray-700 ml-1">Người iu lại giận à? Kể nghe xem!</label>
                    <div class="relative">
                        <textarea id="mood-input" placeholder="Có nhận ra là lỗi của ai chưa? Nếu chưa thì text vào... (Cú pháp: Đã nói những gì + thái độ đối phương)" class="w-full h-32 p-4 bg-rose-50/30 border border-rose-100 rounded-2xl focus:ring-2 focus:ring-rose-200 focus:border-rose-200 outline-none resize-none text-gray-700 placeholder-gray-400 transition-all"></textarea>
                        
                        <button id="btn-analyze" onclick="analyzeMood()" class="absolute bottom-3 right-3 bg-rose-400 hover:bg-rose-500 text-white p-2.5 rounded-xl shadow-sm transition-all active:scale-95 flex items-center justify-center">
                            <svg id="icon-send" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                            <svg id="icon-loading" class="hidden animate-spin" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                        </button>
                    </div>
                </section>

                <!-- Vùng hiển thị kết quả AI (Ẩn mặc định) -->
                <section id="ai-response-container" class="hidden bg-gradient-to-br from-orange-50 to-rose-50 border border-rose-100 rounded-3xl p-6 shadow-sm">
                    <div class="flex items-center space-x-2 mb-4 text-rose-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                        <h3 class="font-medium text-rose-900">Lời nhắn từ AI thấu hiểu:</h3>
                    </div>
                    <p id="ai-advice" class="text-gray-700 leading-relaxed italic mb-6">...</p>
                    
                    <div class="bg-white/60 rounded-2xl p-4 flex items-center space-x-4">
                        <div class="bg-rose-100 p-3 rounded-full shrink-0 text-rose-600">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-rose-400 uppercase tracking-wider mb-1">Gợi ý chữa lành</p>
                            <p id="ai-food" class="font-medium text-gray-800 text-lg">...</p>
                        </div>
                    </div>
                </section>

                <!-- Lịch sử (Hiển thị các bài viết đã lưu) -->
                <section class="mt-8 border-t border-rose-100 pt-6">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-4 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        Lịch sử ghi chép
                    </h3>
                    <div id="history-container" class="space-y-4">
                        <p class="text-sm text-gray-400 italic">Đang tải lịch sử...</p>
                    </div>
                </section>
            </main>
        </div>

        <!-- TRANG 3: GỢI Ý MÓN ĂN -->
        <div id="view-food" class="view-section flex-col h-full">
            <header class="bg-blue-50/50 p-4 border-b border-blue-100 flex items-center shrink-0">
                <button onclick="switchView('view-home')" class="p-2 mr-4 bg-white rounded-full text-gray-500 hover:text-blue-600 shadow-sm transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                </button>
                <h2 class="text-xl font-semibold text-blue-900">Gợi Ý Món Ăn</h2>
            </header>

            <main class="flex-1 overflow-y-auto p-6 scroll-smooth flex flex-col justify-center">
                <section class="bg-white border border-blue-100 rounded-3xl p-8 text-center space-y-6 shadow-sm">
                    <div class="flex justify-center">
                        <div class="bg-blue-50 p-4 rounded-full text-blue-500">
                         <img src="food.JPG" alt="Tom và Nị" class="w-32 h-32 object-cover rounded-full shadow-md mb-6 border-4 border-orange-50">
                        </div>
                    </div>
                    <div>
                        <h3 class="text-2xl font-semibold text-blue-900 mb-2">Hôm nay ăn gì?</h3>
                        <p class="text-sm text-blue-600/70">Nắng mưa là chuyện của trời, để no cái bụng là trời lại thương.</p>
                    </div>
                    
                    <div class="min-h-[5rem] flex items-center justify-center bg-blue-50/30 rounded-2xl border border-blue-50">
                        <span id="random-food-result" class="text-2xl font-bold text-blue-700 transition-all">
                            <span class="text-gray-400 italic text-sm font-normal">No result</span>
                        </span>
                    </div>

                    <button id="btn-spin" onclick="spinFood()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-3 px-6 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
                        <span id="spin-text">Touch me, please!</span>
                    </button>
                </section>
            </main>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'emotion-food-app-vanilla';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        let app, auth, db, currentUser = null;

        const VIETNAMESE_FOODS = [
            "Phở bò", "Bún chả", "Cơm tấm", "Cháo lòng", "Hủ tiếu chợ HM", "Cơm nhà",
            "Bún bò Huế", "Bánh xèo", "Mì Quảng", "Lẩu boà", "Bún chả cá", "Nui xào/Bột chiên",
            "Bánh cuốn", "Bún riêu cua", "Bánh canh", "Thịt nướng", "Gà rán", "Mì gói",
            "Mì xào giòn", "Bún đậu mắm tôm", "Lẩu riêu cua", "Cháo hàu",
            "Ốc", "Lẩu thái"
        ];

        // Khởi tạo Firebase
        async function initFirebase() {
            try {
                if (Object.keys(firebaseConfig).length > 0) {
                    app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    // Xử lý xác thực
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if (user) {
                            loadHistory();
                        }
                    });
                } else {
                    document.getElementById('history-container').innerHTML = '<p class="text-sm text-rose-500 italic">Không tìm thấy cấu hình Firebase. Tính năng lưu lịch sử bị vô hiệu hóa.</p>';
                }
            } catch (error) {
                console.error("Lỗi khởi tạo Firebase:", error);
            }
        }

        // Tải lịch sử từ Firestore
        function loadHistory() {
            if (!currentUser || !db) return;
            
            const entriesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'journalEntries');
            
            onSnapshot(entriesRef, (snapshot) => {
                const entries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Sắp xếp mới nhất lên đầu
                entries.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderHistory(entries);
            }, (error) => {
                console.error("Lỗi tải lịch sử:", error);
            });
        }

        // Hiển thị lịch sử ra giao diện
        function renderHistory(entries) {
            const container = document.getElementById('history-container');
            if (entries.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-400 italic">Bạn chưa có ghi chép nào.</p>';
                return;
            }

            container.innerHTML = '';
            entries.forEach(entry => {
                const date = new Date(entry.date).toLocaleString('vi-VN', { dateStyle: 'medium', timeStyle: 'short' });
                
                const card = document.createElement('div');
                card.className = 'bg-rose-50/50 border border-rose-100 rounded-2xl p-4 shadow-sm';
                card.innerHTML = `
                    <div class="text-xs text-gray-500 mb-2 border-b border-rose-100/50 pb-2">${date}</div>
                    <div class="mb-3">
                        <span class="text-xs uppercase font-bold text-gray-400 block mb-1">Cảm xúc:</span>
                        <p class="font-medium text-gray-700">"${entry.feeling}"</p>
                    </div>
                    <div class="bg-white/80 p-3 rounded-xl border border-rose-50">
                        <p class="text-sm italic text-gray-600 mb-2">${entry.advice}</p>
                        <div class="flex items-center gap-2 pt-2 border-t border-gray-100 text-rose-600">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
                            <span class="text-sm font-medium">${entry.food}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Xử lý logic Gemini API
        // Xử lý logic Gemini API
       // Xử lý logic Gemini API
        window.analyzeMood = async function() {
            const moodInput = document.getElementById('mood-input');
            const situation = moodInput.value.trim();
            if (!situation) return;

            const btnAnalyze = document.getElementById('btn-analyze');
            const iconSend = document.getElementById('icon-send');
            const iconLoading = document.getElementById('icon-loading');
            const resultContainer = document.getElementById('ai-response-container');

            // Hiệu ứng Loading
            btnAnalyze.disabled = true;
            btnAnalyze.classList.add('opacity-70', 'cursor-not-allowed');
            iconSend.classList.add('hidden');
            iconLoading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                const payload = {
                    contents: [{
                        role: "user",
                        parts: [{ text: `Tôi đã làm việc này khiến người yêu/đối phương giận hoặc khó chịu: "${situation}". Hãy đóng vai một chuyên gia tư vấn tình cảm, đưa ra gợi ý những câu nói chân thành để xin lỗi/làm hòa và những hành động cụ thể để bù đắp giúp đối phương không còn giận.` }]
                    }],
                    systemInstruction: {
                        parts: [{ text: "Bạn là chuyên gia tâm lý tình cảm. Trả về định dạng JSON với 2 trường: 'words' (gợi ý những câu nói làm hòa ngắn gọn, chân thành) và 'actions' (gợi ý hành động cụ thể để bù đắp)." }]
                    },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "words": { type: "STRING" },
                                "actions": { type: "STRING" }
                            },
                            required: ["words", "actions"]
                        }
                    }
                };

                // DÁN API KEY CỦA BẠN VÀO GIỮA 2 DẤU NGOẶC KÉP BÊN DƯỚI
                const apiKey = "AQ.Ab8RN6KUHkrVcTuIQ7waOmNHjwEqygenyefgXoti4Lc_Xy5nkw"; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                // Bắt lỗi nếu API Key bị sai hoặc chưa có
                if (!response.ok) {
                    throw new Error("Lỗi kết nối API hoặc thiếu API Key");
                }

                const data = await response.json();
                
                if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                    const parsedResult = JSON.parse(data.candidates[0].content.parts[0].text);
                    
                    // Hiển thị kết quả 
                    document.getElementById('ai-advice').innerText = `"${parsedResult.words}"`;
                    document.getElementById('ai-food').innerText = parsedResult.actions;
                    resultContainer.classList.remove('hidden');

                    // Lưu vào Firestore với các trường dữ liệu mới
                    if (currentUser && db) {
                        const entriesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'journalEntries');
                        await addDoc(entriesRef, {
                            situation: situation,
                            words: parsedResult.words,
                            actions: parsedResult.actions,
                            date: new Date().toISOString()
                        });
                    }

                    moodInput.value = ''; // Xóa text area
                }
            } catch (error) {
                console.error("Lỗi AI:", error);
                // Hiển thị kết quả dự phòng nếu có lỗi
                document.getElementById('ai-advice').innerText = "Xin lỗi, hiện tại tôi không thể kết nối hoặc API Key bị thiếu. Nhưng hãy thử nói một lời xin lỗi chân thành nhất từ trái tim bạn nhé. 💖";
                document.getElementById('ai-food').innerText = "Chủ động ôm người ấy một cái thật chặt";
                resultContainer.classList.remove('hidden');
                moodInput.value = ''; // Xóa nội dung đi để người dùng biết đã gửi
            } finally {
                // Tắt hiệu ứng Loading
                btnAnalyze.disabled = false;
                btnAnalyze.classList.remove('opacity-70', 'cursor-not-allowed');
                iconSend.classList.remove('hidden');
                iconLoading.classList.add('hidden');
            }
        };

        // Xử lý random món ăn
        let isSpinning = false;
        window.spinFood = function() {
            if (isSpinning) return;
            
            // Lấy ngày hiện tại (định dạng DD/MM/YYYY) để tạo key lưu trữ
            const today = new Date().toLocaleDateString('vi-VN');
            const storageKey = `spunFoods_${today}`;
            
            // Lấy danh sách các món đã quay hôm nay từ localStorage (nếu có)
            let spunFoods = JSON.parse(localStorage.getItem(storageKey)) || [];
            
            // Lọc ra các món CHƯA được quay trong hôm nay
            let availableFoods = VIETNAMESE_FOODS.filter(food => !spunFoods.includes(food));
            
            // Nếu đã quay hết tất cả các món trong danh sách, làm mới lại từ đầu
            if (availableFoods.length === 0) {
                alert("Đã hết sự lựa chọn cho hôm nay! Nhịn đói đi.");
                spunFoods = [];
                localStorage.setItem(storageKey, JSON.stringify(spunFoods));
                availableFoods = [...VIETNAMESE_FOODS];
            }

            isSpinning = true;
            const btnSpin = document.getElementById('btn-spin');
            const spinText = document.getElementById('spin-text');
            const resultText = document.getElementById('random-food-result');
            
            btnSpin.disabled = true;
            btnSpin.classList.add('opacity-70');
            spinText.innerText = 'Đang chọn...';
            resultText.classList.add('blur-text');

            let count = 0;
            const maxSpins = 15; // Số lần chớp nháy hiệu ứng
            
            const interval = setInterval(() => {
                // Hiệu ứng chớp nháy lấy ngẫu nhiên từ toàn bộ danh sách cho đẹp mắt
                const randomVisualIndex = Math.floor(Math.random() * VIETNAMESE_FOODS.length);
                resultText.innerHTML = VIETNAMESE_FOODS[randomVisualIndex];
                count++;
                
                if (count > maxSpins) {
                    clearInterval(interval);
                    
                    // Lựa chọn kết quả cuối cùng từ danh sách CÁC MÓN CHƯA QUAY
                    const finalIndex = Math.floor(Math.random() * availableFoods.length);
                    const finalFood = availableFoods[finalIndex];
                    
                    resultText.innerHTML = finalFood;
                    
                    // Cập nhật món vừa quay vào danh sách đã quay và lưu vào localStorage
                    spunFoods.push(finalFood);
                    localStorage.setItem(storageKey, JSON.stringify(spunFoods));

                    // Khôi phục trạng thái nút bấm
                    isSpinning = false;
                    btnSpin.disabled = false;
                    btnSpin.classList.remove('opacity-70');
                    
                    // THAY ĐỔI CHỮ TRÊN NÚT BẤM SAU LẦN QUAY ĐẦU TIÊN
                    spinText.innerText = 'Touch me again, please!'; 
                    resultText.classList.remove('blur-text');
                }
            }, 100);
        };

        // Hàm chuyển View (SPA)
        window.switchView = function(viewId) {
            document.querySelectorAll('.view-section').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById(viewId).classList.add('active');
        };

        // Chạy khởi tạo Firebase khi trang load
        initFirebase();

    </script>
</body>
</html>
